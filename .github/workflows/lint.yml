name: Lint
on: [push]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Makefile dry-run parses
        run: |
          make -n all > /dev/null
          make -n bench > /dev/null
          make -n dylib > /dev/null
      - name: Shell scripts parse
        run: bash -n scripts/*.sh
      - name: Python bindings compile (syntax)
        run: python3 -m py_compile bindings/python/*.py
      - name: Docs check
        run: bash scripts/check_docs.sh
