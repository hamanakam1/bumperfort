name: Edge Build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: Build & run all tests via Makefile
        run: |
          make test FC=gfortran
      - name: Link C-ABI bench client
        run: |
          make bench FC=gfortran
