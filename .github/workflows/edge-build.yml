name: Edge Build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: Build & test
        run: |
          gfortran -O3 -ffast-math -c src/*.f90
          gfortran -O3 -ffast-math -o test_bounce test/test_bounce.f90 src/*.f90
          ./test_bounce
